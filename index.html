<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Updated</title>

<style>
:root {
    --primary: #ff4d4d;
    --dark: #111;
}

body {
    margin: 0;
    font-family: Arial;
    background: #f3f3f3;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
    background: var(--dark);
    color: white;
}

.nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}

/* Hero */
.hero {
    text-align: center;
    padding: 50px;
    background: linear-gradient(135deg, #ff4d4d, #ff884d);
    color: white;
}

.btn {
    background: white;
    color: var(--primary);
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
}

/* Products */
.container {
    padding: 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

/* Card */
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding-bottom: 15px;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* 🔥 Discount Badge */
.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: red;
    color: white;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 5px;
}

/* ⭐ Rating */
.rating {
    color: gold;
    margin: 5px 0;
}

/* Price */
.price {
    color: var(--primary);
    font-weight: bold;
}

/* Footer */
footer {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 20px;
}
</style>

</head>
<body>

<div class="navbar">
    <h2>MyShop</h2>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
    </div>
</div>

<div class="hero">
    <h1>🔥 Special Offers</h1>
    <button class="btn">Shop Now</button>
</div>

<div class="container">
    <h2>Products</h2>

    <div class="grid">

        <!-- Card 1 -->
        <div class="card">
            <span class="badge">20% OFF</span>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
            <h3>Smart Watch</h3>
            <div class="rating">⭐⭐⭐⭐☆</div>
            <p class="price">₹1499</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <span class="badge">15% OFF</span>
            <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df">
            <h3>Earbuds</h3>
            <div class="rating">⭐⭐⭐⭐⭐</div>
            <p class="price">₹999</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <span class="badge">25% OFF</span>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <h3>Shoes</h3>
            <div class="rating">⭐⭐⭐⭐☆</div>
            <p class="price">₹1999</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Card 4 -->
        <div class="card">
            <span class="badge">10% OFF</span>
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083">
            <h3>Stylish Glasses</h3>
            <div class="rating">⭐⭐⭐⭐☆</div>
            <p class="price">₹899</p>
            <button class="btn">Add to Cart</button>
        </div>

    </div>
</div>

<footer>
    <p>Contact: p4522950993@gmail.com</p>
</footer>

</body>
</html>
