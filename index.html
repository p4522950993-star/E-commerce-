<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Advanced</title>

<style>
:root {
    --primary: #ff4d4d;
    --dark: #111;
    --light: #fff;
}

body {
    margin: 0;
    font-family: Arial;
    background: #f3f3f3;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
    background: var(--dark);
    color: white;
}

.nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}

/* Hero */
.hero {
    text-align: center;
    padding: 50px;
    background: linear-gradient(135deg, #ff4d4d, #ff884d);
    color: white;
}

/* Button */
.btn {
    background: var(--primary);
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

/* Products */
.container {
    padding: 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

/* Card */
.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
}

/* Image Zoom */
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    transition: 0.3s;
}

.card:hover img {
    transform: scale(1.1);
}

/* Badge */
.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: red;
    color: white;
    padding: 5px 8px;
    font-size: 12px;
    border-radius: 5px;
}

/* Wishlist */
.wishlist {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 18px;
    cursor: pointer;
}

/* Content */
.card-body {
    padding: 15px;
    text-align: center;
}

/* Rating */
.rating {
    color: gold;
}

/* Price */
.price {
    color: var(--primary);
    font-weight: bold;
}

/* Quantity */
.qty {
    margin: 8px 0;
}

.qty button {
    padding: 5px 10px;
    margin: 0 5px;
}

/* Footer */
footer {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 20px;
}
</style>

</head>
<body>

<div class="navbar">
    <h2>MyShop</h2>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
    </div>
</div>

<div class="hero">
    <h1>🔥 Exclusive Deals</h1>
    <p>Best products at best prices</p>
</div>

<div class="container">
    <h2>Products</h2>

    <div class="grid">

        <!-- Card -->
        <div class="card">
            <span class="badge">20% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
            <div class="card-body">
                <h3>Smart Watch</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1499</p>

                <div class="qty">
                    <button>-</button> 1 <button>+</button>
                </div>

                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <span class="badge">15% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df">
            <div class="card-body">
                <h3>Earbuds</h3>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <p class="price">₹999</p>

                <div class="qty">
                    <button>-</button> 1 <button>+</button>
                </div>

                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <span class="badge">25% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <div class="card-body">
                <h3>Shoes</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1999</p>

                <div class="qty">
                    <button>-</button> 1 <button>+</button>
                </div>

                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <span class="badge">10% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083">
            <div class="card-body">
                <h3>Stylish Glasses</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹899</p>

                <div class="qty">
                    <button>-</button> 1 <button>+</button>
                </div>

                <button class="btn">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 MyShop | Contact: p4522950993@gmail.com</p>
</footer>

</body>
</html>
