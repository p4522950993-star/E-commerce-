<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Ultimate</title>

<style>
:root {
    --primary: #ff4d4d;
    --dark: #111;
}

body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

.navbar {
    display: flex;
    justify-content: space-between;
    padding: 18px 50px;
    background: var(--dark);
    color: white;
}

.nav-links a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
}

.hero {
    text-align: center;
    padding: 60px;
    background: linear-gradient(135deg, #ff4d4d, #ff884d);
    color: white;
}

.container {
    padding: 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: red;
    color: white;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 5px;
}

.new { background: green; }
.out { background: gray; }

.wishlist {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
}

.card-body {
    padding: 15px;
    text-align: center;
}

.rating {
    color: gold;
}

.price {
    color: var(--primary);
    font-weight: bold;
}

.qty button {
    padding: 5px 10px;
    margin: 5px;
}

.btn {
    background: var(--primary);
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

#controls {
    text-align: center;
    padding: 20px;
}

#controls input, #controls select {
    padding: 10px;
    margin: 5px;
}

#cartSection {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}

.remove-btn {
    margin-left: 10px;
    background: black;
    color: white;
    border: none;
    padding: 3px 8px;
    cursor: pointer;
}

footer {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>MyShop</h2>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#cartSection" id="cartLink">Cart (0)</a>
    </div>
</div>

<div class="hero">
    <h1>🔥 Mega Sale</h1>
</div>

<div id="controls">
    <input type="text" id="search" placeholder="Search product...">
    <select id="filter">
        <option value="all">All</option>
        <option value="available">Available</option>
        <option value="out">Out of Stock</option>
    </select>
    <select id="sort">
        <option value="default">Sort</option>
        <option value="low">Low → High</option>
        <option value="high">High → Low</option>
    </select>
</div>

<div class="container">
    <div class="grid">

        <div class="card">
            <span class="badge">20% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
            <div class="card-body">
                <h3>Smart Watch</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1499</p>
                <div class="qty"><button>-</button>1<button>+</button></div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <span class="badge new">NEW</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df">
            <div class="card-body">
                <h3>Earbuds</h3>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <p class="price">₹999</p>
                <div class="qty"><button>-</button>1<button>+</button></div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <span class="badge out">Out</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <div class="card-body">
                <h3>Shoes</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1999</p>
                <button class="btn">Out of Stock</button>
            </div>
        </div>

        <div class="card">
            <span class="badge">10% OFF</span>
            <span class="wishlist">❤️</span>
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083">
            <div class="card-body">
                <h3>Glasses</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹899</p>
                <div class="qty"><button>-</button>1<button>+</button></div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

<div id="cartSection">
    <h2>🛒 Cart</h2>
    <div id="cartItems"></div>
    <h3 id="totalPrice">Total: ₹0</h3>
    <button class="btn" onclick="clearCart()">Clear Cart</button>
</div>

<footer>
    <p>© 2026 MyShop</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItemsDiv = document.getElementById("cartItems");
const totalPriceDiv = document.getElementById("totalPrice");
const cartLink = document.getElementById("cartLink");

function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function updateCart() {
    cartItemsDiv.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;

        cartItemsDiv.innerHTML += `
            <p>${item.name} (x${item.qty}) - ₹${itemTotal}
            <button class="remove-btn" onclick="removeItem(${index})">X</button></p>
        `;
    });

    totalPriceDiv.textContent = "Total: ₹" + total;
    cartLink.textContent = "Cart (" + cart.length + ")";
}

function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
    updateCart();
}

function clearCart() {
    cart = [];
    saveCart();
    updateCart();
}

document.querySelectorAll(".card").forEach(card => {

    let qty = 1;
    const price = parseInt(card.querySelector(".price")?.textContent.replace("₹","")) || 0;
    const name = card.querySelector("h3").textContent;

    const qtyDiv = card.querySelector(".qty");

    if (qtyDiv) {
        function updateQty() {
            qtyDiv.innerHTML = `<button>-</button>${qty}<button>+</button>`;
            const btns = qtyDiv.querySelectorAll("button");

            btns[0].onclick = () => { if (qty > 1) { qty--; updateQty(); } };
            btns[1].onclick = () => { qty++; updateQty(); };
        }
        updateQty();
    }

    const btn = card.querySelector(".btn");

    if (btn && btn.textContent !== "Out of Stock") {
        btn.onclick = () => {
            cart.push({name, price, qty});
            saveCart();
            updateCart();
        };
    }

    const heart = card.querySelector(".wishlist");
    if (heart) {
        heart.onclick = () => {
            heart.textContent = heart.textContent === "❤️" ? "🤍" : "❤️";
        };
    }

});

const searchInput = document.getElementById("search");
const filterSelect = document.getElementById("filter");
const sortSelect = document.getElementById("sort");
const cards = document.querySelectorAll(".card");

searchInput.oninput = filterProducts;
filterSelect.onchange = filterProducts;
sortSelect.onchange = sortProducts;

function filterProducts() {
    const search = searchInput.value.toLowerCase();
    const filter = filterSelect.value;

    cards.forEach(card => {
        const name = card.querySelector("h3").textContent.toLowerCase();
        const isOut = card.querySelector(".out");

        let show = true;

        if (!name.includes(search)) show = false;
        if (filter === "available" && isOut) show = false;
        if (filter === "out" && !isOut) show = false;

        card.style.display = show ? "block" : "none";
    });
}

function sortProducts() {
    const grid = document.querySelector(".grid");
    const cardsArray = Array.from(cards);

    cardsArray.sort((a, b) => {
        const priceA = parseInt(a.querySelector(".price")?.textContent.replace("₹","")) || 0;
        const priceB = parseInt(b.querySelector(".price")?.textContent.replace("₹","")) || 0;

        if (sortSelect.value === "low") return priceA - priceB;
        if (sortSelect.value === "high") return priceB - priceA;
        return 0;
    });

    cardsArray.forEach(card => grid.appendChild(card));
}

updateCart();
</script>

</body>
</html>
