<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Pro</title>

<style>
:root {
    --primary: #ff4d4d;
    --dark: #111;
    --light: #fff;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
}

/* 🔷 Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: var(--dark);
    color: white;
}

.logo {
    color: var(--primary);
}

.nav-links a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
    transition: 0.3s;
}

.nav-links a:hover {
    color: var(--primary);
}

/* 🟣 Hero */
.hero {
    height: 60vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #ff4d4d, #ff884d);
}

.hero h1 {
    font-size: 50px;
}

.btn {
    background: white;
    color: var(--primary);
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

.btn:hover {
    background: black;
    color: white;
}

/* 🟢 Section Title */
.section-title {
    text-align: center;
    margin: 40px 0 10px;
}

/* 🟢 Products */
.container {
    padding: 20px 50px 50px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

/* 🔷 Card */
.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.3s;
    box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

.card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 15px 25px rgba(0,0,0,0.2);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card-body {
    padding: 15px;
    text-align: center;
}

.price {
    color: var(--primary);
    font-weight: bold;
}

/* ⭐ Rating */
.rating {
    color: gold;
    margin: 5px 0;
}

/* 🔻 Footer */
footer {
    background: var(--dark);
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}
</style>

</head>
<body>

<div class="navbar">
    <h2 class="logo">MyShop</h2>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
        <a href="#">Contact</a>
    </div>
</div>

<div class="hero">
    <div>
        <h1>🔥 Big Sale</h1>
        <p>Top deals on fashion & electronics</p>
        <button class="btn">Shop Now</button>
    </div>
</div>

<h2 class="section-title">Featured Products</h2>

<div class="container">
    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
            <div class="card-body">
                <h3>Smart Watch</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1499</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df">
            <div class="card-body">
                <h3>Earbuds</h3>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <p class="price">₹999</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <div class="card-body">
                <h3>Shoes</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹1999</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083">
            <div class="card-body">
                <h3>Stylish Glasses</h3>
                <div class="rating">⭐⭐⭐⭐☆</div>
                <p class="price">₹899</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 MyShop | Contact: p4522950993@gmail.com</p>
</footer>

</body>
</html>
